name: Feature / Enhancement Request
description: Suggest an idea or enhancement for the portfolio
title: "[FEATURE]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: Thank you for contributing enhancement ideas!
  - type: textarea
    id: problem
    attributes:
      label: Is your feature request related to a problem?
      description: A clear and concise description of the problem or limitation.
    validations:
      required: false
  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution / Feature
      description: A clear description of what you'd like to see added.
    validations:
      required: true
